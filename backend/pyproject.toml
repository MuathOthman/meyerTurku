[project]
name = "keel"
version = "0.1.0"
description = "Deterministic compliance checker for ship general arrangement drawings"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24",
  "shapely>=2.0",
  "networkx>=3.2",
  "pydantic>=2.6",
  "typer>=0.12",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pillow>=10.0",
  "numpy>=1.26",
  "python-multipart>=0.0.9",
  "opencv-python-headless>=4.9",
  "certifi>=2024.2.2",
  "rapidocr-onnxruntime>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
keel = "keel.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["keel*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
