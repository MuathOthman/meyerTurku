<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keel Analyse</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f4f5f6;--panel:#fff;--ink:#1a2026;--muted:#5d6873;--line:#dde1e5;--accent:#0b5c8a;--warn:#a85f00;--warn-bg:#fff3e0;--pass:#14733a;--pass-bg:#e8f5ec}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0} header span{color:var(--muted)} a{color:var(--accent)}
form{display:flex;flex-wrap:wrap;gap:12px;align-items:end;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
label{display:flex;flex-direction:column;gap:3px;color:var(--muted);font-size:13px}
input,button{font:inherit;padding:6px 8px;border:1px solid #b9c0c7;border-radius:5px;background:#fff;color:var(--ink);max-width:100%}
button{background:var(--accent);border-color:var(--accent);color:#fff;cursor:pointer;padding:7px 14px}
button:disabled{opacity:.55;cursor:wait}
label.row{flex-direction:row;align-items:center;gap:6px;padding-bottom:7px}
.notice{margin:12px 16px;padding:9px 12px;border-radius:6px;background:var(--warn-bg);color:var(--warn)}
main{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:12px;padding:0 16px 16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:0}
#picture{overflow:auto;max-height:calc(100vh - 150px)} #picture img{display:block;max-width:none;width:100%;min-width:900px}
#list{overflow:auto;max-height:calc(100vh - 150px)}
details{border-bottom:1px solid var(--line);padding:9px 12px}
summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.num{background:#b40000;color:#fff;font-weight:700;border-radius:3px;padding:0 5px;font-size:12px}
.type{color:var(--muted);font-size:12.5px}
.low{color:var(--warn);font-size:12px;font-weight:600}
ul{margin:6px 0 0;padding-left:17px} li{margin-top:5px}
.ref{font-weight:600}.unconfirmed{color:var(--warn);font-size:12px}
.m{margin-top:2px;font-size:12.5px;color:var(--muted)}
.section{padding:8px 12px;font-weight:600;background:#f8f9fa;border-bottom:1px solid var(--line)}
.empty{padding:14px 12px;color:var(--muted)}
@media(max-width:900px){main{grid-template-columns:minmax(0,1fr)}#picture,#list{max-height:none}}
</style>
</head>
<body>
<header><h1>Keel</h1><span>Find the spaces in a new drawing and list what to check.</span><a href="/" style="margin-left:auto">Back to the checked deck</a></header>
<form id="form">
  <label>Drawing (PDF or image)<input type="file" name="file" required accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff,.bmp"></label>
  <label>PDF page index<input type="number" name="page" value="0" min="0" style="width:80px"></label>
  <label>Scale, mm per unit (optional)<input type="number" name="mm_per_unit" step="any" min="0" style="width:130px" placeholder="not measured"></label>
  <label class="row"><input type="checkbox" name="use_ai" checked> Use AI for spaces with no readable label</label>
  <button id="go">Analyse</button>
</form>
<div id="status"></div>
<main id="main" hidden>
  <section class="panel" id="picture"></section>
  <section class="panel" id="list"></section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function spaceHtml(s){
  const items = s.checklist.map(c => `<li><span class="ref">${esc(c.ref)}</span>${c.reference_confirmed ? '' : ' <span class="unconfirmed">reference not yet confirmed</span>'}<br>${esc(c.what)}${c.measured ? `<div class="m">Measured, ${esc(c.verdict)}: ${esc(c.measured)}</div>` : ''}</li>`).join('');
  return `<details>
    <summary><span class="num">${s.number}</span><b>${esc(s.name)}</b>${s.compartment ? `<span>${esc(s.compartment)}</span>` : ''}
      <span class="type">${esc(s.category)}${s.area_m2 != null ? `, ${s.area_m2} m²` : ''}</span>
      ${s.name_on_drawing ? '' : '<span class="low">confirm name</span>'}</summary>
    <ul>${items}</ul>
  </details>`;
}

function render(r){
  const known = r.spaces.filter(s => s.name !== 'Unidentified space');
  const unknown = r.spaces.filter(s => s.name === 'Unidentified space');
  $('status').innerHTML = `<div class="notice">Names are unreviewed, so an engineer must confirm them. ${esc(r.scale_note)}${r.naming_error ? ' ' + esc(r.naming_error) : ''}</div>`;
  $('picture').innerHTML = `<img src="${esc(r.image)}" alt="Drawing with each space numbered">`;
  $('list').innerHTML =
    `<div class="section">${known.length} spaces identified</div>` + (known.map(spaceHtml).join('') || '<div class="empty">None could be identified.</div>') +
    (unknown.length ? `<div class="section">${unknown.length} unidentified, name these first</div>` + unknown.map(spaceHtml).join('') : '') +
    (r.set_aside.length ? `<div class="section">${r.set_aside.length} areas set aside</div><div class="empty">${r.set_aside.map(a => `#${a.number} ${esc(a.description)}`).join(', ')}</div>` : '');
  $('main').hidden = false;
}

$('form').onsubmit = async e => {
  e.preventDefault();
  const data = new FormData($('form'));
  if(!data.get('mm_per_unit')) data.delete('mm_per_unit');
  data.set('use_ai', $('form').use_ai.checked ? 'true' : 'false');
  $('go').disabled = true; $('main').hidden = true;
  $('status').innerHTML = '<div class="notice">Analysing. This can take a few minutes.</div>';
  try{
    const r = await fetch('/api/analyze', {method:'POST', body:data});
    const body = await r.json();
    if(!r.ok) throw new Error(body.detail || r.status);
    render(body);
  }catch(err){ $('status').innerHTML = `<div class="notice">Could not analyse this file: ${esc(err.message)}</div>`; }
  $('go').disabled = false;
};
</script>
</body>
</html>
